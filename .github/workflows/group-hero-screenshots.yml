name: Capture group hero screenshots

on:
  push:
    branches:
      - design/group-management-editorial
    paths:
      - app/groups/_components/group-detail.module.css
      - scripts/capture-group-details-screenshots.mjs
      - .github/workflows/group-hero-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'liang799/booking-web-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Serve Storybook
        run: |
          python3 -m http.server 6006 --directory storybook-static > /tmp/groups-storybook.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:6006/iframe.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/groups-storybook.log
          exit 1
      - name: Capture real light and dark screenshots
        run: node scripts/capture-group-details-screenshots.mjs
      - name: Commit screenshot evidence to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/groups/visual-comparison/after-hero-light.png docs/assets/groups/visual-comparison/after-hero-dark.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(groups): capture light and dark group hero previews [skip ci]"
            git push origin HEAD:refs/heads/design/group-management-editorial
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-hero-screenshots
          path: docs/assets/groups/visual-comparison/after-hero-*.png
          if-no-files-found: warn
          retention-days: 7
